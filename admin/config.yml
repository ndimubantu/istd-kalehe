backend:
  name: github
  repo: Ndimubantu/istd-kalehe
  branch: main

# Dossier où les photos ajoutées depuis l'admin seront rangées
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "fr"

collections:
  - name: "admissions"
    label: "Page Admissions"
    files:
      - file: "content/admissions.json"
        label: "Contenu de la page Admissions"
        name: "admissions"
        fields:
          - label: "Bannière"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titre de la page", name: "title", widget: "string" }
          - label: "Introduction"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
              - { label: "Note (date limite)", name: "note", widget: "text" }
          - label: "Encart horaires/adresse"
            name: "office_card"
            widget: "object"
            fields:
              - { label: "Titre horaires", name: "hours_title", widget: "string" }
              - { label: "Texte horaires", name: "hours_text", widget: "string" }
              - { label: "Titre adresse", name: "address_title", widget: "string" }
              - { label: "Texte adresse", name: "address_text", widget: "text" }
          - label: "En-tête \"Réservez votre place\""
            name: "reservation"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - { label: "Mention légale sous le formulaire", name: "disclaimer", widget: "text" }
          - label: "Documents requis"
            name: "documents"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - label: "Premier cycle"
                name: "cycle1"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Liste des documents"
                    name: "items"
                    widget: "list"
                    field: { label: "Document", name: "item", widget: "string" }
              - label: "Deuxième cycle"
                name: "cycle2"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
                  - { label: "Texte du bouton", name: "link_text", widget: "string" }
          - label: "Profils candidats"
            name: "profiles"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - label: "Les 3 cartes"
                name: "cards"
                widget: "list"
                label_singular: "Carte"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Citation", name: "quote", widget: "text" }

  - name: "partenaires"
    label: "Page Partenaires"
    files:
      - file: "content/partenaires.json"
        label: "Contenu de la page Partenaires"
        name: "partenaires"
        fields:
          - label: "Bannière"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titre de la page", name: "title", widget: "string" }
          - label: "Introduction"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Partenaire principal (Hujambo Abari)"
            name: "main_partner"
            widget: "object"
            fields:
              - { label: "Nom du partenaire", name: "title", widget: "string" }
              - { label: "Description", name: "text", widget: "text" }
          - label: "Partenaire technique (Starlink)"
            name: "tech"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - { label: "Nom du partenaire", name: "card_title", widget: "string" }
              - { label: "Description", name: "card_text", widget: "text" }
          - { label: "Phrase d'appel (devenir partenaire)", name: "footer_note", widget: "string" }

  - name: "vie-etudiante"
    label: "Page Vie étudiante"
    files:
      - file: "content/vie-etudiante.json"
        label: "Contenu de la page Vie étudiante"
        name: "vie-etudiante"
        fields:
          - label: "Bannière"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titre de la page", name: "title", widget: "string" }
          - label: "Internat"
            name: "internat"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Les 3 cartes"
                name: "cards"
                widget: "list"
                label_singular: "Carte"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
          - label: "Salle informatique / Numérique"
            name: "numerique"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Encart Starlink"
                name: "highlight"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
              - label: "Nos atouts (liste)"
                name: "atouts"
                widget: "list"
                field: { label: "Point", name: "item", widget: "string" }
              - label: "Bénéfices pour l'étudiant (liste)"
                name: "benefices"
                widget: "list"
                field: { label: "Point", name: "item", widget: "string" }
              - { label: "Note de bas de section", name: "note", widget: "text" }
          - { label: "Citation", name: "quote", widget: "string" }

  - name: "programmes"
    label: "Page Programmes"
    files:
      - file: "content/programmes.json"
        label: "Contenu de la page Programmes"
        name: "programmes"
        fields:
          - label: "Bannière"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titre de la page", name: "title", widget: "string" }
          - label: "Intro système LMD"
            name: "lmd_intro"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Les 3 cartes"
                name: "cards"
                widget: "list"
                label_singular: "Carte"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
          - label: "Premier cycle (Licence)"
            name: "licence"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - label: "Filières"
                name: "filieres"
                widget: "list"
                label_singular: "Filière"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Nom de la filière", name: "title", widget: "string" }
                  - { label: "Citation / accroche", name: "quote", widget: "text" }
                  - label: "Points clés"
                    name: "bullets"
                    widget: "list"
                    field: { label: "Point", name: "item", widget: "string" }
          - label: "Deuxième cycle (Maîtrise)"
            name: "maitrise"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - label: "Les 4 cartes"
                name: "cards"
                widget: "list"
                label_singular: "Carte"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
          - { label: "Encart d'information (candidats de l'ancien système)", name: "info_box", widget: "text" }
          - label: "Bouton d'appel à l'action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Texte du bouton", name: "link_text", widget: "string" }

  - name: "a-propos"
    label: "Page À propos"
    files:
      - file: "content/a-propos.json"
        label: "Contenu de la page À propos"
        name: "a-propos"
        fields:
          - label: "Bannière"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titre de la page", name: "title", widget: "string" }
          - label: "Bloc \"Notre mission\""
            name: "mission"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Premier paragraphe", name: "paragraph_1", widget: "text" }
              - { label: "Deuxième paragraphe", name: "paragraph_2", widget: "text" }
          - label: "Bloc \"Corps enseignant\""
            name: "team"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Les 3 cartes"
                name: "cards"
                widget: "list"
                label_singular: "Carte"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
          - label: "Mot du Directeur Général"
            name: "director"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Premier paragraphe", name: "paragraph_1", widget: "text" }
              - { label: "Deuxième paragraphe", name: "paragraph_2", widget: "text" }
              - { label: "Troisième paragraphe", name: "paragraph_3", widget: "text" }
              - { label: "Nom du Directeur", name: "name", widget: "string" }
              - { label: "Fonction", name: "role", widget: "string" }

  - name: "accueil"
    label: "Page d'accueil"
    files:
      - file: "content/accueil.json"
        label: "Contenu de la page d'accueil"
        name: "accueil"
        fields:
          - label: "En-tête (hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petite ligne au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre principal", name: "title", widget: "string" }
              - { label: "Paragraphe d'introduction", name: "subtitle", widget: "text" }
              - { label: "Texte du bouton principal", name: "cta_primary", widget: "string" }
              - { label: "Texte du bouton secondaire", name: "cta_secondary", widget: "string" }
          - label: "Section \"Explorez l'ISTD Kalehe\""
            name: "explorer"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
          - label: "Bloc \"Présentation\""
            name: "feature"
            widget: "object"
            fields:
              - { label: "Petite étiquette", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
              - { label: "Texte du lien", name: "link_text", widget: "string" }
          - label: "Les 4 cartes"
            name: "cards"
            widget: "list"
            label_singular: "Carte"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
              - { label: "Texte du lien", name: "link_text", widget: "string" }
          - { label: "Citation", name: "quote", widget: "string" }

  - name: "site"
    label: "Réglages du site"
    files:
      - file: "content/site.json"
        label: "Slogan et coordonnées (toutes les pages)"
        name: "site"
        fields:
          - { label: "Slogan (sous le logo, en-tête)", name: "slogan", widget: "string" }
          - label: "Phrases du pied de page"
            name: "footer_taglines"
            widget: "list"
            label_singular: "Phrase"
            summary: "{{fields.tagline}}"
            fields:
              - { label: "Phrase", name: "tagline", widget: "string" }
          - label: "Coordonnées de contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Adresse", name: "address", widget: "string" }
              - { label: "Téléphone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }

  - name: "actualites"
    label: "Actualités"
    files:
      - file: "content/actualites.json"
        label: "Liste des actualités"
        name: "actualites"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true }
              - label: "Icône"
                name: "icon"
                widget: "select"
                default: "fa-solid fa-bullhorn"
                options:
                  - { label: "Mégaphone (annonce générale)", value: "fa-solid fa-bullhorn" }
                  - { label: "Diplôme (graduation)", value: "fa-solid fa-graduation-cap" }
                  - { label: "Trophée / distinction", value: "fa-solid fa-award" }
                  - { label: "Groupe de personnes / événement", value: "fa-solid fa-people-group" }
                  - { label: "Livre / académique", value: "fa-solid fa-book-open" }
                  - { label: "Calendrier", value: "fa-solid fa-calendar-days" }
              - { label: "Résumé (2-3 phrases)", name: "body", widget: "text" }
              - { label: "Texte du lien (ex: « Voir les admissions »)", name: "link_text", widget: "string", required: false, default: "En savoir plus" }
              - { label: "Page liée (ex: admissions.html, galerie.html)", name: "link_url", widget: "string", required: false, default: "#" }

  - name: "galerie"
    label: "Galerie photos"
    files:
      - file: "content/galerie.json"
        label: "Photos de la galerie"
        name: "galerie"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            label_singular: "Photo"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options:
                  - "Campus"
                  - "Vie étudiante"
                  - "Cérémonies / Graduations"
                  - "Activités académiques"
                  - "Infrastructures"
              - { label: "Légende / texte alternatif", name: "title", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false, choose_url: false }
